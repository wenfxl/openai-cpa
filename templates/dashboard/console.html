<div v-show="currentTab === 'console'" class="fluent-console-page fluent-page">
    <section class="fluent-terminal-card">
            <div class="fluent-card-header">
                <div class="min-w-0">
                    <h2>实时运行日志</h2>
                    <p>处理过程、资源状态与错误信息会在这里持续输出。</p>
                </div>
                <div class="fluent-terminal-actions">
                    <span class="fluent-section-status" :class="isRunning ? 'is-live' : ''">
                        <span class="fluent-status-dot" :class="isRunning ? 'is-live' : ''"></span>
                        {{ isRunning ? '数据流已连接' : '等待任务启动' }}
                    </span>
                    <button @click="clearLogs" class="fluent-button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span>清空日志</span>
                    </button>
                </div>
            </div>
            <div class="fluent-terminal-toolbar">
                <div class="flex items-center gap-2 min-w-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="truncate">wfxl-openai-terminal</span>
                </div>
                <span class="fluent-terminal-live" :class="isRunning ? 'is-live' : ''">
                    <span class="fluent-status-dot" :class="isRunning ? 'is-live' : ''"></span>
                    {{ isRunning ? '实时' : '待命' }}
                </span>
            </div>
            <div class="fluent-terminal" id="terminal-container" style="scroll-behavior: smooth;">
                <div v-if="logs.length === 0" class="fluent-terminal-empty">
                    <div class="fluent-terminal-empty-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <p>系统待命</p>
                    <span>点击右上角“启动”开始任务，日志将在此显示。</span>
                </div>

                <div v-for="log in logs" :key="log.id" class="fluent-log-line">
                    <template v-if="log.parsed">
                        <span class="fluent-log-time">{{ log.time }}</span>
                        <span class="fluent-log-level" :class="`is-${String(log.level).toLowerCase()}`">{{ log.level }}</span>
                        <span class="fluent-log-text">{{ log.text }}</span>
                    </template>
                    <span v-else class="fluent-log-text">{{ log.raw }}</span>
                </div>
            </div>
    </section>
</div>
